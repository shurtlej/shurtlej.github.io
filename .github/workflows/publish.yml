name: Publish HTML site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "_site/**"

permissions:
  contents: write

concurrency:
  group: publish-gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site files
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check site entry point
        run: test -f _site/index.html

      - name: Publish _site to gh-pages
        run: |
          git fetch origin gh-pages
          git worktree add --detach "$RUNNER_TEMP/gh-pages" origin/gh-pages
          rsync -a --delete --exclude='/.git' _site/ "$RUNNER_TEMP/gh-pages/"
          cd "$RUNNER_TEMP/gh-pages"
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then
            echo "The published site is already up to date."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Publish HTML site"
          git push origin HEAD:gh-pages
